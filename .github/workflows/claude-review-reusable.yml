name: Claude Code Review (reusable)

# Central reusable workflow — lives in WebLime-agency/.github.
# Every repo's caller triggers on pull_request and delegates here, so the
# review logic (model, plugin, prompt, gates) is edited in ONE place.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN — uses the existing Claude subscription, so
# reviews cost nothing per run but share that one account's rate limits. If
# whole-team volume starts hitting the wall, switch the single `with:` line
# below to `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` (pay-as-you-go,
# no wall) and add that org secret — callers never change.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Volume control (2026-10-30, subscription quota): review when a PR is opened,
    # reopened or marked ready, NOT on every push (synchronize); skip bot PRs. A new
    # review on demand is `@claude` (claude-mention workflow). The classify step
    # below also skips docs-only / lockfile-only PRs.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    # Private repos use the org self-hosted runner (free minutes); public repos
    # (e.g. nucleus) fall back to GitHub-hosted, because the org runner group sets
    # allows_public_repositories=false so self-hosted jobs from public repos queue
    # forever. Keeps the "weblime-ci = private only" rule intact.
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Classify changed files (skip docs-only / lockfile-only PRs)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$PR_URL/files" --paginate --jq '.[].filename') || { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # fail open: an empty or unreadable list still reviews
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq '(\.md$|\.mdx$|^docs/|(^|/)package-lock\.json$|(^|/)pnpm-lock\.yaml$|(^|/)yarn\.lock$|(^|/)Cargo\.lock$|(^|/)CODEOWNERS$)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.classify.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_args: "--max-turns 16"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          use_sticky_comment: true
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
