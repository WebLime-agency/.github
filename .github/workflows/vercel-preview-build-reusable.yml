name: Vercel Preview Build (reusable)

# Central reusable workflow — lives in WebLime-agency/.github.
# Per-repo callers own the pull_request trigger; this keeps the tokenless
# preview build logic in one place while preserving repo-specific variables.

on:
  workflow_call:
    inputs:
      preview_base_branch:
        description: "Branch the caller should trigger preview builds against."
        required: false
        type: string
        default: dev
      node_version_file:
        description: "Path to the Node.js version file."
        required: false
        type: string
        default: .node-version

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Vercel preview output
    runs-on: [self-hosted, Linux, X64, weblime-ci]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies
        run: npm ci

      - name: Inject repo/org Variables into build env
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_E2E_VISUAL_TEST: ${{ vars.PUBLIC_E2E_VISUAL_TEST }}
          PUBLIC_SHORTLINK_ORIGIN: ${{ vars.PUBLIC_SHORTLINK_ORIGIN }}
          PUBLIC_STRIPE_PRODUCTION: ${{ vars.PUBLIC_STRIPE_PRODUCTION }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          # Only this reviewed, build-safe allowlist reaches PR-controlled build code.
          # All other repository and organization configuration stays out of the job.
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const allowlist = [
              "PUBLIC_APP_ORIGIN",
              "PUBLIC_APP_URL",
              "PUBLIC_E2E_VISUAL_TEST",
              "PUBLIC_SHORTLINK_ORIGIN",
              "PUBLIC_STRIPE_PRODUCTION",
              "PUBLIC_SUPABASE_ANON_KEY",
              "PUBLIC_SUPABASE_PUBLISHABLE_KEY",
              "PUBLIC_SUPABASE_URL",
            ];
            const entries = [];
            for (const name of allowlist) {
              const value = process.env[name];
              if (!value) continue;
              let delimiter;
              do delimiter = `ghadelimiter_${crypto.randomUUID()}`;
              while (value.includes(delimiter));
              entries.push(`${name}<<${delimiter}\n${value}\n${delimiter}\n`);
            }
            if (entries.length) fs.appendFileSync(process.env.GITHUB_ENV, entries.join(""));
          '

      - name: Build Vercel output
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Verify Vercel output
        run: |
          set -euo pipefail

          test -d .vercel/output
          test -f .vercel/output/config.json

          if ! find .vercel/output -mindepth 1 -maxdepth 1 | grep -q .; then
            echo ".vercel/output is empty."
            exit 1
          fi
