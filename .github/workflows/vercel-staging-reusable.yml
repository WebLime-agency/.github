                  "$CURL_BIN" --disable --config - "${curl_args[@]}" "$url"
              )
            else
              result=$("$CURL_BIN" --disable "${curl_args[@]}" "$url")
            fi
            curl_status=$?
            set -e

            if [ "$curl_status" -ne 0 ]; then
              return "$curl_status"
            fi

            printf '%s\n' "$result"
          }

