              cd "$NEUTRAL_DIR" || exit 1
              PYTHONSAFEPATH=1 PYTHONPATH='' PYTHONSTARTUP='' HOME="$HOME" "$PYTHON_BIN" -I -S - "$1" <<'PYTHON'
          import posixpath
          import re
          import sys
          from urllib.parse import unquote, urlsplit
          try:
              url = sys.argv[1]
              if any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in url) or re.search(r"%(?![0-9A-Fa-f]{2})", url):
