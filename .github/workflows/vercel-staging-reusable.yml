              host = unquote(parsed.hostname or "", errors="strict").lower().encode("idna").decode("ascii").rstrip(".")
              port = parsed.port
              if not host or any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in host) or parsed.username is not None or any(c in host for c in "/\\?#@%") or (port is not None and not 1 <= port <= 65535):
