              smoke_failed=true
              return 0
            fi

            read -r http_code effective_url <<< "$result"
            if [ -z "$http_code" ]; then
              echo "::error title=Staging smoke malformed response::$label returned no HTTP status."
              smoke_failed=true
              return 0
            fi
            if ! landing=$(classify_landing_url "$effective_url"); then
              landing=unsafe
            fi
            if [ "$landing" = "login" ]; then
              echo "::error title=Staging smoke hit Vercel login::$label redirected to a Vercel login or SSO page, which is not a successful smoke."
              smoke_failed=true
              return 0
            fi
            if [ "$landing" != "https" ]; then
              echo "::error title=Staging smoke unsafe landing::$label returned a malformed URL or a non-HTTPS final landing."
              smoke_failed=true
              return 0
            fi
            case "$http_code" in
              2??)
                ;;
              3??)
                echo "::error title=Staging smoke unexpected redirect::$label returned HTTP $http_code to $effective_url. Redirects are not followed for this check."
                smoke_failed=true
                ;;
              *)
                echo "::error title=Staging smoke HTTP failure::$label returned HTTP $http_code."
                smoke_failed=true
                ;;
            esac
            return 0
          }

          # Read the secret into a shell variable and remove it from the
          # environment so child processes cannot inherit it.
          bypass_configured=false
          candidate_bypass_secret=""
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            bypass_configured=true
            # Only characters that cannot be written safely into a curl config
            # header value are rejected. Do not assume a narrower token format.
            case "$VERCEL_AUTOMATION_BYPASS_SECRET" in
              *[[:cntrl:]]*|*'"'*|*\\*)
                echo "::error title=Invalid protection bypass secret::VERCEL_AUTOMATION_BYPASS_SECRET contains characters that cannot be sent safely through a curl config header."
                smoke_failed=true
                ;;
              *)
                candidate_bypass_secret=$VERCEL_AUTOMATION_BYPASS_SECRET
                ;;
            esac
          fi
          unset VERCEL_AUTOMATION_BYPASS_SECRET

          if [ "$bypass_configured" != "true" ]; then
            echo "::error title=Staging smoke missing protection bypass::VERCEL_AUTOMATION_BYPASS_SECRET not configured. Configure Protection Bypass for Automation on the staging Vercel project and pass the secret from the caller."
            smoke_failed=true
          elif [ -n "$candidate_bypass_secret" ]; then
            check_url "candidate" "$DEPLOYMENT_URL" "$candidate_bypass_secret" false
          fi

          # Alias hosts are public by design: always tokenless, no bypass header.
          IFS=',' read -r -a aliases_array <<< "$PROMOTED_ALIASES"
          for alias in "${aliases_array[@]}"; do
            check_url "alias ${alias}" "https://${alias}" "" true
          done

          if [ "$smoke_failed" = "true" ]; then
            echo "::error title=Staging smoke failed::Post-promotion smoke failed; this is a manual-recovery incident and no token-bearing rollback is attempted by design."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "result=success" >> "$GITHUB_OUTPUT"

          SMOKE

      - name: Finalize staging result
        id: finalize
        if: always()
        env:
          CONTROL_RESULT: ${{ steps.control.outputs.result }}
          SMOKE_RESULT: ${{ steps.smoke.outputs.result }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DEPLOYMENT_URL: ${{ steps.control.outputs.deployment_url }}
          PROMOTED_ALIASES: ${{ steps.control.outputs.promoted_aliases }}
        run: |
          set -euo pipefail

          RESULT="${CONTROL_RESULT:-failed}"
          if [ "$RESULT" = success ]; then
            RESULT=failed
            if [ "${SMOKE_OUTCOME:-}" = success ] && [ "${SMOKE_RESULT:-}" = success ]; then
              RESULT=success
            fi
          fi
          if [ -z "$RESULT" ]; then
            RESULT="failed"
          fi

          {
            echo "deployment_url=${DEPLOYMENT_URL:-}"
            echo "promoted_aliases=${PROMOTED_ALIASES:-}"
            echo "result=$RESULT"
          } >> "$GITHUB_OUTPUT"

          case "$RESULT" in
            success|superseded)
              ;;
            failed|rolled_back|rollback_failed)
              echo "::error title=Staging deploy did not complete successfully::result=$RESULT"
              exit 1
              ;;
            *)
              echo "::error title=Unknown staging result::result=$RESULT"
              exit 1
              ;;
          esac

      - name: Clean staging deploy context
        if: always() && steps.deploy_context.outputs.deploy_dir != ''
        env:
          DEPLOY_DIR: ${{ steps.deploy_context.outputs.deploy_dir }}
          NEUTRAL_DIR: ${{ runner.temp }}
          PYTHON_BIN: ${{ steps.tools.outputs.python }}
        run: |
          set -euo pipefail
          (
            cd "$NEUTRAL_DIR"
            PYTHONSAFEPATH=1 PYTHONPATH='' PYTHONSTARTUP='' HOME="$NEUTRAL_DIR" "$PYTHON_BIN" -I -S - <<'PYTHON'
          import os
          from pathlib import Path
          import shutil
          deploy = Path(os.environ["DEPLOY_DIR"])
          if deploy.is_symlink() or deploy.parent.resolve() != Path.cwd().resolve() or not deploy.name.startswith("vercel-staging-deploy-"):
              raise SystemExit("::error::Refusing cleanup of an unexpected deploy path.")
          if deploy.exists():
              shutil.rmtree(deploy)
          PYTHON
          )
