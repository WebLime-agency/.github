          # candidate request never follows redirects: any 3xx fails the check
          # instead of carrying the bypass secret to another host. Alias
          # requests are tokenless and may follow redirects, and their final
          # URL is inspected for a Vercel login/SSO landing page.
          #
          # The returned line is "<http_code> <effective_url>". A curl
          # transport failure is returned as a nonzero status instead of a
          # response line, even when headers were already written.
          smoke_url() {
            local url=$1
            local bypass_secret=$2
            local follow_redirects=$3
            local result
            local curl_status

