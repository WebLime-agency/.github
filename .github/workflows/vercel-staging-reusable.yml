          # injection before creating children, then discard inherited env.
          while IFS= read -r inherited_name; do
            case "$inherited_name" in
              BASH_ENV|ENV|LD_PRELOAD|LD_LIBRARY_PATH|LD_AUDIT|PYTHONPATH|PYTHONSTARTUP|NODE_OPTIONS|NODE_PATH|NODE_EXTRA_CA_CERTS|SSL_CERT_FILE|SSL_CERT_DIR|HTTPS_PROXY|HTTP_PROXY|ALL_PROXY|NODE_TLS_REJECT_UNAUTHORIZED|GIT_CONFIG*|GIT_EXEC_PATH|GIT_TEMPLATE_DIR|GIT_SSH*|GIT_ASKPASS|GIT_PROXY_COMMAND|GIT_ALLOW_PROTOCOL|GIT_PROTOCOL*|GIT_ATTR*|GIT_OBJECT*|GIT_ALTERNATE*|GIT_COMMON_DIR|GIT_DIR|GIT_WORK_TREE|GIT_INDEX_FILE|GIT_CEILING_DIRECTORIES)
