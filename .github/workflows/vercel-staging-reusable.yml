              if any(ord(c) < 32 or ord(c) == 127 for c in decoded) or "\\" in decoded:
                  raise ValueError("invalid path")
              path = posixpath.normpath("/" + decoded.lstrip("/")).lower()
              login = (host == "vercel.com" or host.endswith(".vercel.com")) and (path.startswith("/login") or any(segment.startswith("sso") for segment in path.split("/")[1:]))
