name: Vercel Staging Deploy (reusable)

# Central reusable workflow - lives in WebLime-agency/.github.
# Trusted staging path for governed dev releases. This workflow is artifact-free
# and runs on the long-lived shared weblime-ci runner. A1/A2 hardening reduces
# runner risk, but true host isolation is still tracked by:
# https://github.com/eba8/mission-control/issues/413
#
# Process-group cleanup and scrubbed environments below are defense in depth,
# NOT an isolation boundary. Same-user code can escape a process group or read
# same-user files/processes. P1-1 remains open, awaiting isolation decision.
# Operator preconditions:
# - Recommend required reviewers and a deployment-branch restriction to dev
#   for the consumer's staging environment; the reusable does not enforce these.
# - Private dev fetches use the caller's ephemeral contents:read GitHub token
#   via a process-only credential helper; checkout credentials stay unpersisted.
# - Provision /opt/weblime/vercel/56.3.1/vercel from vercel@56.3.1 dist/vc.js,
#   root-owned, not group/world-writable, immutable where feasible.
# - Provision the exact Node.js release named by the consumer's
#   node_version_file at /usr/bin/node, root-owned and not
#   group/world-writable. This reusable never resolves node through PATH.
# - Callers must pass project_settings as reviewed NON-SECRET JSON. Allowed
#   keys: framework, buildCommand, installCommand, devCommand, outputDirectory,
#   rootDirectory, nodeVersion (string or null). Example for a static site:
#   '{"framework":null,"installCommand":"","buildCommand":null,"outputDirectory":"public"}'
#   rootDirectory must be null/empty; monorepo roots are unsupported. The
#   remote Vercel project's Root Directory setting MUST also be empty.
#   Match the staging project's settings. Never include environment variables,
#   credentials, or secret values. The tokenless build writes these settings and
#   the non-secret org/project IDs to fresh .vercel/project.json; no pull occurs.
#   Only .vercel/output and a regenerated ID-only link enter a fresh deploy
#   directory. Repository sources and vercel.* configuration never enter it.
#   Prebuilt output must recursively contain only directories and regular files,
#   without symlinks or Vercel config files (vercel.ts/mts/js/mjs/cjs/json/toml).
#   Project links use 0700 directories and exclusive 0600 files, even under a
#   permissive umask. Existing project.json files are refused, never overwritten.
# - Keep the consumer repo's staging environment secret VERCEL_TOKEN dedicated
#   to staging, team-scoped for WebLime Vercel, and distinct from production.
# - Rollback is not compare-and-swap: an out-of-band alias change between
#   capture and rollback can be overwritten by the captured target.
# - Own rotation/revocation and the manual recovery runbook for post-promotion
#   smoke failures. The per-repo alias allowlist below is the authorization
#   boundary against production-alias selection.
# - Enable Protection Bypass for Automation on the staging Vercel project
#   (Project Settings > Deployment Protection > Protection Bypass for
#   Automation), then store its value as the GitHub org secret
#   VERCEL_AUTOMATION_BYPASS_SECRET scoped to the repositories that call this
#   reusable. Callers pass it through secrets:. The candidate URL smoke fails
#   closed with "VERCEL_AUTOMATION_BYPASS_SECRET not configured" until the
#   secret is provisioned, because standard Deployment Protection serves a
#   Vercel login redirect on the raw candidate URL. The candidate check never
#   follows redirects, because curl would forward the bypass header to the
#   redirect target. Any candidate 3xx fails the smoke. The public staging
#   aliases are always smoked tokenlessly and may follow redirects.

on:
  workflow_call:
    inputs:
      expected_sha:
        description: "Exact reviewed dev SHA to deploy to staging."
        required: true
        type: string
      project_settings:
        description: "Reviewed non-secret project settings JSON; allowed string/null keys: framework, buildCommand, installCommand, devCommand, outputDirectory, rootDirectory (null/empty only), nodeVersion. Monorepo roots unsupported. Never include env or credentials."
        required: true
        type: string
      node_version_file:
        description: "Path to the Node.js version file."
        required: false
        type: string
        default: .node-version
      vercel_cli_version:
        description: "Pinned operator-provisioned Vercel CLI version to verify."
        required: false
        type: string
        default: 56.3.1
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        description: "Vercel Protection Bypass for Automation secret for the raw candidate URL smoke only. The staging gate fails closed when unset."
        required: false
    outputs:
      deployment_url:
        description: "Immutable candidate Vercel deployment URL."
        value: ${{ jobs.deploy-staging.outputs.deployment_url }}
      promoted_aliases:
        description: "Comma-joined aliases promoted to the candidate."
        value: ${{ jobs.deploy-staging.outputs.promoted_aliases }}
      result:
        description: "success, superseded, failed, rolled_back, or rollback_failed. Caller contract: superseded means restart, not deployment success; failed, rolled_back, and rollback_failed need failure handling; a post-promotion `failed` requires manual recovery; results from a failed reusable job must be read from this output, not inferred from job status alone."
        value: ${{ jobs.deploy-staging.outputs.result }}

permissions:
  contents: read

concurrency:
  group: vercel-staging-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging to Vercel
    runs-on: [self-hosted, Linux, X64, weblime-ci]
    environment: staging
    outputs:
      deployment_url: ${{ steps.finalize.outputs.deployment_url }}
      promoted_aliases: ${{ steps.finalize.outputs.promoted_aliases }}
      result: ${{ steps.finalize.outputs.result }}
    steps:
      - name: Validate staging inputs
        id: inputs
        env:
          # Pass presence only; the bypass value remains scoped to smoke.
          BYPASS_CONFIGURED: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NODE_VERSION_FILE: ${{ inputs.node_version_file }}
        run: |
          set -euo pipefail
          if [ "$BYPASS_CONFIGURED" != true ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET not configured"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected_sha"
            exit 1
          fi
          if [[ ! "$NODE_VERSION_FILE" =~ ^[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$ ]] || [[ "/$NODE_VERSION_FILE/" == */../* ]] || [[ "/$NODE_VERSION_FILE/" == */./* ]]; then
            echo "::error::Invalid node_version_file"
            exit 1
          fi

      - name: Prepare staging aliases
        id: prep
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY_NAME" in
            WebLime-agency/limey-web-app)
              ALIASES="pythonlife.org,staging.lm.fm"
              ;;
            *)
              echo "::error title=Unsupported staging repository::No staging alias allowlist exists for $GITHUB_REPOSITORY_NAME."
              exit 1
              ;;
          esac

          IFS=',' read -r -a alias_array <<< "$ALIASES"
          for alias in "${alias_array[@]}"; do
            case "$alias" in
              pythonlife.org|staging.lm.fm) ;;
              lm.fm|www.lm.fm|limey.app|www.limey.app|production.*|www.production.*)
                echo "::error title=Production domain refused::The staging reusable refuses to promote production alias $alias."
                exit 1
                ;;
              *)
                echo "::error title=Unreviewed staging alias::Alias $alias is not in the reviewed staging allowlist."
                exit 1
                ;;
            esac
          done

          {
            echo "aliases=$ALIASES"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight trusted tools
        id: tools
        env:
          EXPECTED_VERCEL_CLI_VERSION: ${{ inputs.vercel_cli_version }}
        run: |
          set -euo pipefail

          EXPECTED_PINNED_VERSION="56.3.1"
          EXPECTED_VERCEL_CLI_PATH="/opt/weblime/vercel/56.3.1/vercel"
          EXPECTED_VERCEL_CLI_SHA256="c0e8cfad56746ea7a496604fc8b1e9ef71624d1784f07415a41777bdddb2536f"

          if [ "$EXPECTED_VERCEL_CLI_VERSION" != "$EXPECTED_PINNED_VERSION" ]; then
            echo "::error title=Unsupported Vercel CLI version::This reusable is reviewed only for Vercel CLI $EXPECTED_PINNED_VERSION."
            exit 1
          fi

          walk_tool_chain() {
            local name=$1
            local path=$2
            local current=$path

            while :; do
              local metadata owner mode
              if ! metadata="$(/usr/bin/stat -Lc '%u %a' "$current" 2>/dev/null)"; then
                echo "::error title=$name metadata failure::Unable to verify ownership and permissions for $current." >&2
                exit 1
              fi
              read -r owner mode <<< "$metadata"
              if [ "$owner" != "0" ]; then
                echo "::error title=Untrusted $name owner::$current must be root-owned." >&2
                exit 1
              fi
              if [[ ! "$mode" =~ ^[0-7]{3,4}$ ]] || (( (8#$mode & 0022) != 0 )); then
                echo "::error title=Unsafe $name permissions::$current must not be group- or world-writable." >&2
                exit 1
              fi
              [ "$current" = "/" ] && break
              current=${current%/*}
              [ -z "$current" ] && current="/"
            done
          }

          require_abs_tool() {
            local name=$1
            local path=$2

            case "$path" in
              /*) ;;
              *)
                echo "::error title=Untrusted $name path::$name must resolve to an absolute path." >&2
                exit 1
                ;;
            esac

            if [ ! -x "$path" ]; then
              echo "::error title=Missing trusted $name::$path is not executable." >&2
              exit 1
            fi

            # Reject both the lexical path chain and the fully resolved chain so
            # a symlink into a writable directory cannot smuggle in a tool.
            walk_tool_chain "$name" "$path"
            local resolved
            if ! resolved="$("$READLINK_BIN" -f -- "$path" 2>/dev/null)"; then
              echo "::error title=$name resolution failure::Unable to canonicalize $path." >&2
              exit 1
            fi
            walk_tool_chain "$name resolved" "$resolved"
          }

          resolve_path_tool() {
            local name=$1
            local path
            if ! path="$(command -v "$name" 2>/dev/null)"; then
              echo "::error title=Missing trusted $name::Unable to resolve $name on PATH for preflight." >&2
              exit 1
            fi
            case "$path" in
              /*) ;;
              *)
                echo "::error title=Untrusted $name resolution::$name resolved to non-file command '$path'." >&2
                exit 1
                ;;
            esac
            require_abs_tool "$name" "$path"
            printf '%s\n' "$path"
          }

          READLINK_BIN="/usr/bin/readlink"
          if [ ! -x "$READLINK_BIN" ]; then
            echo "::error title=Missing trusted readlink::$READLINK_BIN is not executable." >&2
            exit 1
          fi
          walk_tool_chain "readlink" "$READLINK_BIN"

          require_abs_tool "stat" "/usr/bin/stat"
          require_abs_tool "sha256sum" "/usr/bin/sha256sum"
          for tool_path in /usr/bin/env /bin/bash /usr/bin/mktemp /usr/bin/mkdir /usr/bin/rm /usr/bin/setsid; do
            require_abs_tool "step tool" "$tool_path"
          done

          GIT_BIN="$(resolve_path_tool git)"
          CURL_BIN="$(resolve_path_tool curl)"
          JQ_BIN="$(resolve_path_tool jq)"
          PYTHON_BIN="/usr/bin/python3"
          require_abs_tool "python3" "$PYTHON_BIN"
          NODE_BIN="/usr/bin/node"
          require_abs_tool "node" "$NODE_BIN"
          require_abs_tool "vercel" "$EXPECTED_VERCEL_CLI_PATH"

          # The CLI is a Node entrypoint. Always start it through the
          # preflighted absolute interpreter with a sanitized startup
          # environment, never through /usr/bin/env node on PATH.
          run_vercel_cli() {
            (
              cd "${RUNNER_TEMP:-/tmp}"
              NODE_OPTIONS='' NODE_PATH='' "$NODE_BIN" -- "$EXPECTED_VERCEL_CLI_PATH" "$@"
            )
          }

          read -r ACTUAL_VERCEL_CLI_SHA256 _ < <(/usr/bin/sha256sum "$EXPECTED_VERCEL_CLI_PATH")
          if [ "$ACTUAL_VERCEL_CLI_SHA256" != "$EXPECTED_VERCEL_CLI_SHA256" ]; then
            echo "::error title=Vercel CLI hash mismatch::The operator-provisioned CLI hash does not match the reviewed vercel@$EXPECTED_PINNED_VERSION binary."
            exit 1
          fi

          VERCEL_VERSION_OUTPUT="$(run_vercel_cli --version 2>/dev/null || true)"
          VERCEL_VERSION_LINE=""
          while IFS= read -r version_line; do
            version_line=${version_line%$'\r'}
            if [ -n "$version_line" ]; then
              VERCEL_VERSION_LINE=$version_line
            fi
          done <<< "$VERCEL_VERSION_OUTPUT"
          if [ "$VERCEL_VERSION_LINE" != "$EXPECTED_VERCEL_CLI_VERSION" ] && [ "$VERCEL_VERSION_LINE" != "Vercel CLI $EXPECTED_VERCEL_CLI_VERSION" ]; then
            echo "::error title=Vercel CLI version mismatch::Expected $EXPECTED_VERCEL_CLI_VERSION from the operator-provisioned CLI."
            exit 1
          fi

          {
            echo "git=$GIT_BIN"
            echo "curl=$CURL_BIN"
            echo "jq=$JQ_BIN"
            echo "python=$PYTHON_BIN"
            echo "node=$NODE_BIN"
            echo "vercel=$EXPECTED_VERCEL_CLI_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Validate reviewed project settings
        env:
          PROJECT_SETTINGS_JSON: ${{ inputs.project_settings }}
          PYTHON_BIN: ${{ steps.tools.outputs.python }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PYTHONSAFEPATH=1 "$PYTHON_BIN" -I -S - <<'PYTHON'
          import json, os
          allowed = {"framework", "buildCommand", "installCommand", "devCommand", "outputDirectory", "rootDirectory", "nodeVersion"}
          try:
              settings = json.loads(os.environ["PROJECT_SETTINGS_JSON"])
              if not isinstance(settings, dict) or not settings or set(settings) - allowed:
                  raise ValueError()
              if any(v is not None and not isinstance(v, str) for v in settings.values()):
                  raise ValueError()
              if settings.get("rootDirectory") not in (None, ""):
                  raise ValueError()
          except (KeyError, ValueError):
              raise SystemExit("::error::Invalid reviewed project_settings")
          PYTHON

      - name: Checkout exact staging source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: src-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify exact source
        id: source
        env:
          READ_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GIT_BIN: ${{ steps.tools.outputs.git }}
        working-directory: src-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error title=Missing expected SHA::expected_sha is required."
            exit 1
          fi

          ACTUAL_SHA="$("$GIT_BIN" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error title=Unexpected checkout SHA::Checked out $ACTUAL_SHA, expected $EXPECTED_SHA."
            exit 1
          fi

          if [ -n "$("$GIT_BIN" status --porcelain)" ]; then
            echo "::error title=Dirty checkout::The isolated staging checkout is not clean."
            exit 1
          fi

          read_token=${READ_TOKEN:-}
          unset READ_TOKEN
          # persist-credentials:false is intentional. Use the job-scoped,
          # contents:read GitHub token only in this fetch subprocess; disable
          # stored helpers. Nothing is written to repository credential config.
          # shellcheck disable=SC2016 # The credential helper expands in git, not this shell.
          fetch_dev() {
            READ_TOKEN="$read_token" GIT_TERMINAL_PROMPT=0 "$GIT_BIN" \
              -c credential.helper= \
              -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$READ_TOKEN"; }; f' \
              fetch --quiet --no-tags "https://github.com/$GITHUB_REPOSITORY_NAME.git" \
              '+refs/heads/dev:refs/remotes/origin/dev'
          }
          fetch_dev
          ORIGIN_DEV_SHA="$("$GIT_BIN" rev-parse refs/remotes/origin/dev)"
          if ! "$GIT_BIN" merge-base --is-ancestor "$EXPECTED_SHA" "$ORIGIN_DEV_SHA"; then
            echo "::error::expected_sha is not an ancestor of origin/dev"
            exit 1
          fi
          echo "origin_dev_sha=$ORIGIN_DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: src-${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.node_version_file }}

      - name: Build Vercel staging output
        id: build
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROJECT_SETTINGS_JSON: ${{ inputs.project_settings }}
          PYTHON_BIN: ${{ steps.tools.outputs.python }}
          NEUTRAL_DIR: ${{ runner.temp }}
          NODE_OPTIONS: --max-old-space-size=4096
          NODE_BIN: ${{ steps.tools.outputs.node }}
          VERCEL_BIN: ${{ steps.tools.outputs.vercel }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_APP_ENV: ${{ vars.PUBLIC_APP_ENV }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        working-directory: src-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          build_private=$(/usr/bin/mktemp -d /tmp/vercel-staging-build-XXXXXXXX)
          trap '/usr/bin/rm -rf -- "$build_private"' EXIT
          /usr/bin/mkdir -m 700 "$build_private/home" "$build_private/tmp"
          missing=false
          for required_name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!required_name:-}" ]; then
              echo "::error title=Missing Vercel project variable::$required_name must be configured as a non-secret repository or organization Variable."
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            exit 1
          fi

          # Supply only reviewed non-secret settings; IDs alone do not make a
          # fresh checkout buildable by the pinned CLI. Never pull with a token.
          SOURCE_DIR=$PWD
          (
            cd "$NEUTRAL_DIR"
            PYTHONSAFEPATH=1 PYTHONPATH='' PYTHONSTARTUP='' HOME="$build_private/home" "$PYTHON_BIN" -I -S - "$SOURCE_DIR" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import sys
          allowed = {"framework", "buildCommand", "installCommand", "devCommand", "outputDirectory", "rootDirectory", "nodeVersion"}
          try:
              settings = json.loads(os.environ["PROJECT_SETTINGS_JSON"])
              if not isinstance(settings, dict) or not settings or set(settings) - allowed:
                  raise ValueError("unreviewed keys")
              if any(value is not None and not isinstance(value, str) for value in settings.values()):
                  raise ValueError("invalid setting type")
          except (KeyError, ValueError):
              raise SystemExit("::error title=Invalid Vercel project settings::Supply reviewed non-secret settings JSON with only the documented keys and string/null values.")
          if settings.get("rootDirectory") not in (None, ""):
              raise SystemExit("::error title=Unsupported Vercel root directory::rootDirectory must be null or empty; monorepo roots are unsupported.")
          source = Path(sys.argv[1])
          vercel = source / ".vercel"
          if vercel.is_symlink():
              raise SystemExit("::error::Refusing symlinked Vercel project settings.")
          vercel.mkdir(mode=0o700, exist_ok=True)
          vercel.chmod(0o700)
          project = {"orgId": os.environ["VERCEL_ORG_ID"], "projectId": os.environ["VERCEL_PROJECT_ID"], "settings": settings}
          try:
              fd = os.open(vercel / "project.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          except FileExistsError:
              raise SystemExit("::error::Refusing existing Vercel project settings; a fresh project.json is required.")
          with os.fdopen(fd, "w") as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump(project, output)
          PYTHON
          )
          (
            cd "$NEUTRAL_DIR"
            /usr/bin/env -i \
              PATH=/usr/bin:/bin HOME="$build_private/home" TMPDIR="$build_private/tmp" \
              CI=1 NO_UPDATE_NOTIFIER=1 VERCEL_TELEMETRY_DISABLED=1 \
              NODE_OPTIONS=--max-old-space-size=4096 \
              EXPECTED_SHA="$EXPECTED_SHA" \
              VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" \
              PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL:-}" \
              PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY:-}" \
              PUBLIC_SITE_URL="${PUBLIC_SITE_URL:-}" PUBLIC_APP_ENV="${PUBLIC_APP_ENV:-}" \
              PUBLIC_TURNSTILE_SITE_KEY="${PUBLIC_TURNSTILE_SITE_KEY:-}" \
              "$PYTHON_BIN" -I -S - "$SOURCE_DIR" "$NODE_BIN" "$VERCEL_BIN" <<'SUPERVISOR'
          import ctypes
          import os
          import signal
          import subprocess
          import sys
          import time
          # Reap orphaned descendants in this group as well as the CLI itself.
          # This is cleanup, not containment: children can escape via setsid.
          if ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) != 0:
              raise SystemExit("::error::Cannot supervise build descendants")
          child = subprocess.Popen(["/usr/bin/setsid", "--", sys.argv[2], "--", sys.argv[3], "build"], cwd=sys.argv[1])
          status = 1
          try:
              status = child.wait()
          finally:
              try:
                  os.killpg(child.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              # Bounded reaping; a surviving group fails closed before control.
              for attempt in range(100):
                  try:
                      while os.waitpid(-child.pid, os.WNOHANG)[0]:
                          pass
                  except ChildProcessError:
                      pass
                  try:
                      os.killpg(child.pid, 0)
                  except ProcessLookupError:
                      break
                  time.sleep(0.02)
              else:
                  raise SystemExit("::error::Build process group survived cleanup")
          raise SystemExit(status if status >= 0 else 1)
          SUPERVISOR
          )

          if [ ! -d .vercel/output ] || [ ! -f .vercel/output/config.json ]; then
            echo "::error title=Missing Vercel output::vercel build did not create .vercel/output/config.json."
            exit 1
          fi

          # Hand off only the successful build of this verified checkout.
          {
            echo "source_dir=$PWD"
            echo "source_sha=$EXPECTED_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare staging deploy context
        id: deploy_context
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BUILD_SOURCE_DIR: ${{ steps.build.outputs.source_dir }}
          BUILD_SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
          NEUTRAL_DIR: ${{ runner.temp }}
          PYTHON_BIN: ${{ steps.tools.outputs.python }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        working-directory: src-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          SOURCE_DIR=$PWD
          if [ "${BUILD_SOURCE_DIR:-}" != "$SOURCE_DIR" ] || [ "${BUILD_SOURCE_SHA:-}" != "$EXPECTED_SHA" ] || [ ! -f "$SOURCE_DIR/.vercel/output/config.json" ]; then
            echo "::error title=Staging build binding failed::Missing output or build receipt does not match the exact-SHA checkout."
            exit 1
          fi
          (
            cd "$NEUTRAL_DIR"
            PYTHONSAFEPATH=1 PYTHONPATH='' PYTHONSTARTUP='' HOME="$NEUTRAL_DIR" "$PYTHON_BIN" -I -S - "$SOURCE_DIR" <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import sys
          import tempfile
          def verify_output(output):
              pending = [output]
              forbidden = {"vercel.ts", "vercel.mts", "vercel.js", "vercel.mjs", "vercel.cjs", "vercel.json", "vercel.toml"}
              while pending:
                  path = pending.pop()
                  mode = path.lstat().st_mode
                  if path.name.lower() in forbidden:
                      raise SystemExit("::error title=Unsafe prebuilt output::Vercel configuration is forbidden anywhere in prebuilt output.")
                  if stat.S_ISDIR(mode):
                      pending.extend(path.iterdir())
                  elif not stat.S_ISREG(mode):
                      raise SystemExit("::error title=Unsafe prebuilt output::Symlinks and non-regular files are forbidden in prebuilt output.")
          source_output = Path(sys.argv[1]) / ".vercel/output"
          if source_output.parent.is_symlink():
